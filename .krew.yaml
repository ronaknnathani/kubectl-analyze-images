apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: analyze-images
spec:
  version: {{ .TagName }}
  homepage: https://github.com/ronaknnathani/kubectl-analyze-images
  shortDescription: "Visualize Kubernetes image usage and sizes"
  description: |
    Visualizes the largest and most-used container images in a Kubernetes cluster
    at a glance. The report combines:

    - Image sizes from node status data
    - Pod, container, and init-container usage counts
    - Cached-on-node counts
    - Image size distribution and percentile summaries
    - Sorting by size, pod usage, or cached-on-node counts
    - Table and JSON output formats
  caveats: |
    This plugin requires read access to nodes and pods in the cluster.
    Specifically, it needs permissions to list nodes (for image size data)
    and list pods (for namespace/label filtering).
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      {{addURIAndSha "https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/{{ .TagName }}/kubectl-analyze-images_{{ .TagName }}_linux_amd64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      {{addURIAndSha "https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/{{ .TagName }}/kubectl-analyze-images_{{ .TagName }}_linux_arm64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      {{addURIAndSha "https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/{{ .TagName }}/kubectl-analyze-images_{{ .TagName }}_darwin_amd64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      {{addURIAndSha "https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/{{ .TagName }}/kubectl-analyze-images_{{ .TagName }}_darwin_arm64.tar.gz" .TagName | indent 6 }}
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      {{addURIAndSha "https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/{{ .TagName }}/kubectl-analyze-images_{{ .TagName }}_windows_amd64.zip" .TagName | indent 6 }}
      bin: kubectl-analyze-images.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      {{addURIAndSha "https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/{{ .TagName }}/kubectl-analyze-images_{{ .TagName }}_windows_arm64.zip" .TagName | indent 6 }}
      bin: kubectl-analyze-images.exe
