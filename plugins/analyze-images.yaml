apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: analyze-images
spec:
  version: v1.4.0
  homepage: https://github.com/ronaknnathani/kubectl-analyze-images
  shortDescription: "Visualize Kubernetes image usage and sizes"
  description: |
    Visualizes the largest and most-used container images in a Kubernetes cluster
    at a glance. The report combines:

    - Image sizes from node status data
    - Pod, container, and init-container usage counts
    - Cached-on-node counts
    - Image size distribution and percentile summaries
    - Sorting by size, pod usage, or cached-on-node counts
    - Table and JSON output formats
  caveats: |
    This plugin requires read access to nodes and pods in the cluster.
    Specifically, it needs permissions to list nodes (for image size data)
    and list pods (for namespace/label filtering).
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.4.0/kubectl-analyze-images_1.4.0_linux_amd64.tar.gz
      sha256: f601add4c349e36ff83c3cc2dd4275f2413e1923609d3d9cdc599f49854f9e37
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.4.0/kubectl-analyze-images_1.4.0_linux_arm64.tar.gz
      sha256: 564aea44c24894aa8c54c38ba80a67953c23f5fe79eab27305464cbae462ecf9
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.4.0/kubectl-analyze-images_1.4.0_darwin_amd64.tar.gz
      sha256: 89bf7e0d8dbf3dbf672c052dfc20759266a67e97a7569cca860e808571fd95e1
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.4.0/kubectl-analyze-images_1.4.0_darwin_arm64.tar.gz
      sha256: 5ba67fa2a64e61ef91601db6095cd3bb451eb901f56ab2aab6152e953abbe905
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.4.0/kubectl-analyze-images_1.4.0_windows_amd64.zip
      sha256: d45e12c80b8ed934042f34b86d78c7a6d91abfe9ee54765fd83d40f5b362e547
      bin: kubectl-analyze-images.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.4.0/kubectl-analyze-images_1.4.0_windows_arm64.zip
      sha256: efd40f0511d231ee021570593d14ef9455e52bb7626761d90449269d8357878e
      bin: kubectl-analyze-images.exe
