apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: analyze-images
spec:
  version: v1.3.0
  homepage: https://github.com/ronaknnathani/kubectl-analyze-images
  shortDescription: "Visualize Kubernetes image usage and sizes"
  description: |
    Visualizes the largest and most-used container images in a Kubernetes cluster
    at a glance. The report combines:

    - Image sizes from node status data
    - Pod, container, and init-container usage counts
    - Cached-on-node counts
    - Image size distribution and percentile summaries
    - Sorting by size, pod usage, or cached-on-node counts
    - Table and JSON output formats
  caveats: |
    This plugin requires read access to nodes and pods in the cluster.
    Specifically, it needs permissions to list nodes (for image size data)
    and list pods (for namespace/label filtering).
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.3.0/kubectl-analyze-images_1.3.0_linux_amd64.tar.gz
      sha256: a84eaae80db9f172d34e6ff6c7f05de5cf3436ce62cd3f950db320e61ac01411
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.3.0/kubectl-analyze-images_1.3.0_linux_arm64.tar.gz
      sha256: 3bc1021e9ffee90c984ce219e329a23f51d647998af3a8f91355b4081fc95865
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.3.0/kubectl-analyze-images_1.3.0_darwin_amd64.tar.gz
      sha256: a038c28dad6129dc609843ace443c75dc24cceb758975242346b8ce7ecda9c2f
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.3.0/kubectl-analyze-images_1.3.0_darwin_arm64.tar.gz
      sha256: 7a60f0287eece3491a500d35e2bc3422903329db47f0abde26093435d1b271f2
      bin: kubectl-analyze-images
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.3.0/kubectl-analyze-images_1.3.0_windows_amd64.zip
      sha256: 65172f46a862bf40ca2be569b8ce3da1adfd982969622245425e1fd74ae8c118
      bin: kubectl-analyze-images.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/ronaknnathani/kubectl-analyze-images/releases/download/v1.3.0/kubectl-analyze-images_1.3.0_windows_arm64.zip
      sha256: 6d715c55298c18daf24e8e06b78ccfde6bde29590a2604eca9a99f94897b4304
      bin: kubectl-analyze-images.exe
